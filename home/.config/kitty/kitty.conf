# kitty im Rice-Look. Neu laden ohne Neustart: Strg + Shift + F5
# Doku: https://sw.kovidgoyal.net/kitty/conf/

# --- Schrift ---
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font ExtraBold
italic_font      auto
bold_italic_font auto
font_size        12.0
modify_font      cell_height 110%
text_composition_strategy 1.0 20

# --- Start ---
# Zeigt beim Oeffnen das kurze fastfetch, dann zsh (Skript: ~/.local/bin/rice-shell/zsh)
shell /home/viggo/.local/bin/rice-shell/zsh

# --- Fenster ---
# Abstand vom Text zum Rahmen (den Rahmen selbst zeichnet Hyprland)
window_padding_width 12
# Deckend, keine Transparenz
background_opacity   1.0
confirm_os_window_close 0
enable_audio_bell    no

# --- Cursor ---
cursor_shape          block
cursor_blink_interval 0
# Kurze Spur beim Springen des Cursors (dezente Animation, 0 = aus)
cursor_trail                 0
cursor_trail_decay           0.12 0.48
cursor_trail_start_threshold 0

click_interval 0.1

# --- Farben: Schwarz-Weiss (Graustufen, wie ein alter Monochrom-Monitor) ---
foreground           #ffffff
background           #000000
selection_foreground #000000
selection_background #ffffff
cursor               #ffffff
cursor_text_color    #000000
url_color            #ffffff

color0  #000000
color8  #5a5a5a
color1  #c8c8c8
color9  #e0e0e0
color2  #b4b4b4
color10 #d0d0d0
color3  #d8d8d8
color11 #eeeeee
color4  #a0a0a0
color12 #c0c0c0
color5  #bcbcbc
color13 #dcdcdc
color6  #aaaaaa
color14 #cccccc
color7  #d0d0d0
color15 #ffffff
