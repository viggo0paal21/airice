<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Written by qs-font-apply (Quickshell Settings > Appearance > System font). qs-font-revert removes it.
     Apps that ask for the generic sans-serif / system-ui font get "JetBrainsMono Nerd Font". Fonts an app asks for by name stay. -->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>JetBrainsMono Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>JetBrainsMono Nerd Font</family></prefer>
  </alias>
</fontconfig>
