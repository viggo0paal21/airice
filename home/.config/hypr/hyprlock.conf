# hyprlock im Terminal-Look (Super + L oder "lock" im Power-Menue).
# Schwarz-Weiss wie der Rest, keine Transparenz: schwarzer Hintergrund, weisse Schrift und Rahmen.
# Schrift: JetBrainsMono Nerd Font.
# Doku: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Kurzes Ein-/Ausblenden, dieselbe Kurve wie die Fenster in hyprland.lua
animations {
    enabled = true
    bezier = snap, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 1.5, snap
    animation = fadeOut, 1, 1, snap
    animation = inputFieldDots, 1, 1, snap
    animation = inputFieldColors, 1, 1.5, snap
    animation = inputFieldWidth, 1, 1.5, snap
    animation = inputFieldFade, 1, 1.5, snap
}

background {
    monitor =
    color = rgb(0, 0, 0)
}

# Uhr
label {
    monitor =
    text = $TIME
    font_family = JetBrainsMono Nerd Font ExtraBold
    font_size = 64
    color = rgb(255, 255, 255)
    position = 0, 230
    halign = center
    valign = center
}

# Datum wie in der Leiste ("Thu 19 Nov")
label {
    monitor =
    text = cmd[update:60000] LC_ALL=C date +"%a %d %b"
    font_family = JetBrainsMono Nerd Font
    font_size = 13
    color = rgb(138, 138, 138)
    position = 0, 160
    halign = center
    valign = center
}

# Kontobild (dasselbe wie in KDE / SDDM), eckig mit weissem Rahmen
image {
    monitor =
    path = /var/lib/AccountsService/icons/viggo
    size = 96
    rounding = 0
    border_size = 2
    border_color = rgb(255, 255, 255)
    position = 0, 25
    halign = center
    valign = center
}

# user@rechner wie im Terminal-Prompt
label {
    monitor =
    text = cmd[update:0] echo "$USER@$(uname -n)"
    font_family = JetBrainsMono Nerd Font Bold
    font_size = 13
    color = rgb(255, 255, 255)
    position = 0, -50
    halign = center
    valign = center
}

# Passwortfeld: schwarz, eckig, weisser Rahmen, runde Punkte
input-field {
    monitor =
    size = 320, 44
    outline_thickness = 2
    outer_color = rgb(255, 255, 255)
    inner_color = rgb(0, 0, 0)
    font_color = rgb(255, 255, 255)
    font_family = JetBrainsMono Nerd Font
    rounding = 0
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    fade_on_empty = false
    placeholder_text = <span foreground="##5a5a5a">password</span>
    fail_text = <span foreground="##ffffff">wrong password</span>
    check_color = rgb(138, 138, 138)
    fail_color = rgb(255, 255, 255)
    capslock_color = rgb(200, 200, 200)
    hide_input = false
    position = 0, -115
    halign = center
    valign = center
}
